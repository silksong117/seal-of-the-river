<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Echoes of Mohenjo-daro</title>
<style>
    /* --- CORE STYLES --- */
    body { margin: 0; overflow: hidden; background: #000; user-select: none; touch-action: none; }
    canvas { display: block; image-rendering: pixelated; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .hidden { display: none !important; }

    /* --- THEMES --- */
    .theme-modern {
        font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
        --bg: rgba(20, 30, 40, 0.85);
        --border: 2px solid #4a90e2;
        --text: #e0e0e0;
        --accent: #4a90e2;
        --radius: 12px;
        --shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 10px rgba(74, 144, 226, 0.4);
    }
    
    .theme-ancient {
        font-family: 'Courier New', Courier, monospace;
        --bg: #2c1e16;
        --border: 6px solid #4a3219;
        --text: #f5deb3;
        --accent: #b8860b;
        --radius: 0px;
        --shadow: 0 0 0 2px #b8860b, inset 0 0 20px rgba(0,0,0,0.9), 8px 8px 0px rgba(0,0,0,0.8);
    }

    /* --- UI PANELS --- */
    .panel {
        position: absolute; background: var(--bg); border: var(--border); color: var(--text);
        border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; pointer-events: auto;
    }

    #journal-btn {
        top: 20px; right: 20px; padding: 10px 20px; font-weight: bold; cursor: pointer; font-size: 18px;
        transition: transform 0.1s; display: flex; align-items: center; gap: 8px; z-index: 100;
    }
    #journal-btn:active { transform: scale(0.95); }

    #hud-prompt {
        bottom: 30px; right: 30px; font-weight: bold; font-size: 18px; text-transform: uppercase;
        animation: pulse 1.5s infinite; letter-spacing: 1px;
    }

    #dialog-box {
        bottom: 40px; left: 50%; transform: translateX(-50%); width: 700px; max-width: 90%;
        display: flex; gap: 20px; align-items: center;
    }
    .portrait-canvas {
        width: 64px; height: 64px; border: 2px solid var(--accent); background: #000;
        image-rendering: pixelated; flex-shrink: 0; box-shadow: inset 0 0 15px rgba(0,0,0,1);
    }
    .dialog-content { flex-grow: 1; line-height: 1.6; font-size: 18px; }
    .dialog-speaker { color: var(--accent); font-weight: bold; margin-bottom: 8px; display: block; font-size: 22px; letter-spacing: 1px;}

    #inventory-panel, #journal-panel { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 340px; z-index: 50;}
    h3 { margin: 0 0 15px 0; color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 5px; text-transform: uppercase; font-size: 22px;}
    .inv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .inv-slot {
        width: 100%; aspect-ratio: 1; background: rgba(0,0,0,0.7); border: 1px solid var(--accent);
        display: flex; justify-content: center; align-items: center; position: relative; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }
    .inv-slot canvas { max-width: 80%; max-height: 80%; }
    .item-count { position: absolute; bottom: 2px; right: 4px; font-size: 14px; font-weight: bold; color: #fff;}
    .journal-entry { margin-bottom: 15px; line-height: 1.5; font-size: 16px; }

    #minigame-ui { top: 10%; left: 50%; transform: translateX(-50%); text-align: center; font-size: 26px; font-weight: bold; }

    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui-layer" class="theme-modern">
    <div id="journal-btn" class="panel" onclick="toggleJournal()">📖 [J] Journal</div>
    <div id="hud-prompt" class="panel hidden">Press [E] to Interact</div>
    
    <div id="dialog-box" class="panel hidden">
        <canvas class="portrait-canvas" id="dialog-portrait" width="64" height="64"></canvas>
        <div class="dialog-content">
            <span class="dialog-speaker" id="dialog-speaker">Name</span>
            <span id="dialog-text">Text goes here.</span>
        </div>
    </div>

    <div id="inventory-panel" class="panel hidden">
        <h3>Inventory</h3><div class="inv-grid" id="inv-grid"></div>
    </div>

    <div id="journal-panel" class="panel hidden">
        <h3>Field Journal</h3><div id="journal-content"></div>
    </div>

    <div id="minigame-ui" class="panel hidden"><span id="minigame-text"></span></div>
</div>

<script>
/**
 * ECHOES OF MOHENJO-DARO
 * Engine: Single-File HTML5 Canvas Caching Engine
 */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let cw, ch;
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; cw = canvas.width; ch = canvas.height; ctx.imageSmoothingEnabled = false; }
window.addEventListener('resize', resize);
resize();

// --- STATE MACHINE & GLOBALS ---
let currentState = 'MODERN_CAMP'; 
let eraTheme = 'modern';
let timeElapsed = 0;
const mapW = 1200, mapH = 800;

const keys = { w: false, a: false, s: false, d: false, e: false, i: false, j: false };
const prevKeys = { ...keys };
const mouse = { x: 0, y: 0, isDown: false };

// Player Object (Hitbox centered at feet for precise AABB & Y-Sorting)
const player = { x: 200, y: 400, w: 24, h: 12, drawW: 32, drawH: 48, drawOffY: -36, speed: 220, sprite: null, animTimer: 0, dir: 1 };

let entities = []; 
let solids = []; // Strict AABB collision boundaries
let floors = []; // Layer drawn UNDER the player, used for Z-sorting fix (Bridges)
let particles = [];

const inventory = {
    modern: [{id: 'trowel', count: 1}, {id: 'brush', count: 1}, {id: 'camera', count: 1}],
    ancient: [{id: 'pot', count: 1}, {id: 'lapis', count: 3}]
};
const flags = { gateOpen: false, brushingComplete: false, tradeComplete: false };
let activeDialogue = null;
let interactTarget = null;
let scaleMinigameActive = false;

// Caches
const Sprites = {};
const Portraits = {};
const Icons = {};
let dirtCanvas, dirtCtx;
let brushGrid = new Array(400).fill(false); 

// --- OFF-SCREEN PROCEDURAL CACHING ---
function createCache(w, h, renderFunc) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cx = c.getContext('2d');
    cx.imageSmoothingEnabled = false;
    renderFunc(cx, w, h);
    return c;
}

function initSprites() {
    // Environment
    Sprites.fence = createCache(64, 64, (c, w, h) => {
        c.strokeStyle = '#555'; c.lineWidth = 2; c.beginPath(); c.moveTo(32,0); c.lineTo(32,h); c.stroke(); 
        c.strokeStyle = '#7f8c8d'; c.lineWidth = 1;
        for(let i=0; i<w; i+=8) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i+8, h); c.stroke(); c.beginPath(); c.moveTo(i+8, 0); c.lineTo(i, h); c.stroke(); }
    });
    Sprites.gate = createCache(64, 120, (c, w, h) => {
        c.fillStyle = '#333'; c.fillRect(0,0,10,h); c.fillRect(w-10,0,10,h); c.fillRect(0,0,w,10);
        c.strokeStyle = '#95a5a6'; c.lineWidth = 2;
        for(let i=0; i<h; i+=10) { c.beginPath(); c.moveTo(0,i); c.lineTo(w,i+10); c.stroke(); c.beginPath(); c.moveTo(w,i); c.lineTo(0,i+10); c.stroke(); }
        c.fillStyle = '#e74c3c'; c.fillRect(w/2-10, h/2-10, 20, 20); // Lock
    });
    Sprites.tent = createCache(140, 100, (c, w, h) => {
        c.fillStyle = '#4a5d23'; c.beginPath(); c.moveTo(w/2, 0); c.lineTo(w, h); c.lineTo(0, h); c.fill();
        c.fillStyle = '#3a4a1c'; c.beginPath(); c.moveTo(w/2, 0); c.lineTo(w, h); c.lineTo(w/2, h); c.fill();
        c.fillStyle = '#111'; c.fillRect(w/2 - 20, h - 40, 40, 40);
    });
    Sprites.table = createCache(80, 50, (c, w, h) => {
        c.fillStyle = '#b0bec5'; c.fillRect(0, 15, w, 15);
        c.fillStyle = '#78909c'; c.fillRect(5, 30, 6, 20); c.fillRect(w-11, 30, 6, 20);
        c.fillStyle = '#111'; c.fillRect(20, 0, 24, 15); c.fillStyle = '#4fc3f7'; c.fillRect(22, 2, 20, 10);
    });
    Sprites.dirtMound = createCache(80, 60, (c, w, h) => {
        c.fillStyle = '#5d4037'; c.beginPath(); c.ellipse(w/2, h/2+10, w/2, h/3, 0, 0, 6.28); c.fill();
        c.fillStyle = '#4e342e'; c.beginPath(); c.ellipse(w/2, h/2, w/2.5, h/4, 0, 0, 6.28); c.fill();
    });
    Sprites.trenchBg = createCache(100, 100, (c, w, h) => {
        c.fillStyle = '#2c1e16'; c.fillRect(0,0,w,h); c.fillStyle = '#3e2723'; c.fillRect(10,10,w-20,h-20); c.fillStyle = '#bf360c'; c.fillRect(20,20,w-40,h-40);
    });
    Sprites.plankBridge = createCache(100, 60, (c, w, h) => {
        c.fillStyle = '#795548'; c.fillRect(0,0,w,h); c.fillStyle = '#3e2723'; for(let y=15; y<h; y+=15) c.fillRect(0, y, w, 2);
    });

    // Ancient Environment
    Sprites.house = createCache(120, 100, (c, w, h) => {
        c.fillStyle = '#d2b48c'; c.fillRect(0,0,w,h); c.fillStyle = '#b09572'; c.fillRect(0, 0, w*0.15, h); c.fillRect(0, h*0.85, w, h*0.15);
        c.fillStyle = '#3e2723'; for(let x=20; x<w-10; x+=25) c.fillRect(x, 10, 8, 8); // Beams
    });
    Sprites.well = createCache(80, 80, (c, w, h) => {
        c.fillStyle = '#7f8c8d'; c.beginPath(); c.arc(40, 40, 40, 0, 6.28); c.fill();
        c.fillStyle = '#bdc3c7'; c.beginPath(); c.arc(40, 40, 32, 0, 6.28); c.fill();
        c.fillStyle = '#111'; c.beginPath(); c.arc(40, 40, 24, 0, 6.28); c.fill(); 
        c.fillStyle = '#188f8d'; c.beginPath(); c.arc(40, 40, 20, 0, 6.28); c.fill(); // Water
    });
    Sprites.waterAnim = createCache(128, 128, (c, w, h) => {
        c.fillStyle = '#0f5e5c'; c.fillRect(0,0,w,h); c.strokeStyle = '#188f8d'; c.lineWidth = 2;
        for(let y=10; y<h; y+=20) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y + Math.sin(y)*10); c.stroke(); }
    });
    Sprites.stoneBridge = createCache(120, 100, (c, w, h) => {
        c.fillStyle = '#95a5a6'; c.fillRect(0,0,w,h); c.strokeStyle = '#7f8c8d'; c.lineWidth = 2;
        for(let x=0; x<w; x+=20) for(let y=0; y<h; y+=20) c.strokeRect(x,y,20,20);
    });
    
    const drawStall = (c1, c2) => createCache(80, 60, (c, w, h) => {
        c.fillStyle = '#8b4513'; c.fillRect(10, 20, 60, 40);
        for(let x=0; x<w; x+=16) { c.fillStyle = (x/16)%2===0 ? c1 : c2; c.fillRect(x, 0, 16, 25); } 
    });
    Sprites.stall1 = drawStall('#2980b9', '#f1c40f'); // Blue/Yellow
    Sprites.stall2 = drawStall('#c0392b', '#ecf0f1'); // Red/White
    Sprites.stall3 = drawStall('#27ae60', '#f1c40f'); // Green/Yellow

    // Characters (Scale 2x to 32x48)
    const drawChar = (skin, top, bot, hair) => createCache(32, 48, (c) => {
        c.scale(2, 2);
        c.fillStyle = skin; c.fillRect(5, 2, 6, 6); // Head
        c.fillStyle = hair; c.fillRect(4, 0, 8, 3); // Hair
        if(hair !== '#111' && hair !== '#000') c.fillRect(4, 3, 2, 4); // Bun/tail
        c.fillStyle = top; c.fillRect(4, 8, 8, 10); // Torso
        c.fillStyle = bot; c.fillRect(5, 18, 2, 6); c.fillRect(9, 18, 2, 6); // Legs
    });
    
    Sprites.maya = drawChar('#f1c27d', '#546e7a', '#1e88e5', '#3e2723'); 
    Sprites.kavir = drawChar('#d2a679', '#ffffff', '#ffffff', '#8b0000');
    Sprites.guard = drawChar('#8d5524', '#263238', '#1a2421', '#111');
    Sprites.worker = drawChar('#d2a679', '#ff9800', '#37474f', '#ffeb3b');
    Sprites.merchant = drawChar('#b8860b', '#2980b9', '#2980b9', '#d2b48c');
    Sprites.villager = drawChar('#a0522d', '#d3d3d3', '#d3d3d3', '#000');

    // Portraits
    const drawPortrait = (bg, skin, headwear) => createCache(64, 64, (c) => {
        c.scale(4, 4); c.fillStyle = bg; c.fillRect(0,0,16,16); c.fillStyle = skin; c.fillRect(4,4,8,8);
        c.fillStyle = headwear; c.fillRect(3,2,10,4); c.fillStyle = '#000'; c.fillRect(5,7,1,1); c.fillRect(10,7,1,1);
    });
    Portraits.maya = drawPortrait('#34495e', '#f1c27d', '#3e2723');
    Portraits.guard = drawPortrait('#2c3e50', '#8d5524', '#111');
    Portraits.worker = drawPortrait('#d35400', '#d2a679', '#ffeb3b');
    Portraits.merchant = drawPortrait('#1a110a', '#b8860b', '#d2b48c');

    // Icons
    const drawItem = (col1, col2, type) => createCache(32, 32, (c) => {
        if(type==='box') { c.fillStyle=col1; c.fillRect(4,8,24,16); c.fillStyle=col2; c.fillRect(8,12,16,8); }
        if(type==='circ') { c.fillStyle=col1; c.beginPath(); c.arc(16,16,12,0,6.28); c.fill(); c.fillStyle=col2; c.beginPath(); c.arc(16,16,6,0,6.28); c.fill(); }
    });
    Icons.trowel = drawItem('#bdc3c7', '#7f8c8d', 'box'); 
    Icons.brush = drawItem('#d35400', '#e67e22', 'box'); 
    Icons.camera = drawItem('#2c3e50', '#95a5a6', 'box');
    Icons.lapis = drawItem('#20509a', '#2c3e50', 'circ');
    Icons.chert = drawItem('#7f8c8d', '#2c3e50', 'box'); 
    Icons.spice = drawItem('#e67e22', '#d35400', 'circ');

    // Terracotta Pot Icon (New Artifact)
    Icons.pot = createCache(32, 32, (c) => {
        c.fillStyle = '#8b4513';
        c.beginPath(); c.ellipse(16, 18, 12, 10, 0, 0, 6.28); c.fill(); // body
        c.fillRect(10, 6, 12, 4); // neck
        c.fillStyle = '#a0522d'; c.fillRect(8, 4, 16, 4); // rim
    });
}

// --- MAP BUILDERS & STRICT COLLISION ---
function addSolid(x, y, w, h, id) { solids.push({x, y, w, h, id}); }
function addFloor(sprite, x, y, w, h) { floors.push({sprite, x, y, w, h}); }
function spawnEntity(sprite, x, y, w, h, drawW, drawH, drawOffY, type, extra = {}) {
    let e = { sprite, x, y, w, h, drawW, drawH, drawOffY, type, ...extra };
    entities.push(e); return e;
}

function buildModernCamp() {
    entities = []; solids = []; floors = [];
    player.sprite = Sprites.maya;
    player.x = 200; player.y = 400;

    // Fences
    for(let i=0; i<1200; i+=64) {
        spawnEntity(Sprites.fence, i, 0, 64, 20, 64, 64, -44, 'prop'); addSolid(i, 0, 64, 20, 'fence');
        spawnEntity(Sprites.fence, i, 780, 64, 20, 64, 64, -44, 'prop'); addSolid(i, 780, 64, 20, 'fence');
    }
    for(let i=0; i<800; i+=64) {
        spawnEntity(Sprites.fence, 0, i, 20, 64, 64, 64, -44, 'prop'); addSolid(0, i, 20, 64, 'fence');
        if(i < 300 || i > 400) { 
            spawnEntity(Sprites.fence, 1180, i, 20, 64, 64, 64, -44, 'prop'); addSolid(1180, i, 20, 64, 'fence');
        }
    }
    
    // PHYSICAL GATE
    if (!flags.gateOpen) {
        spawnEntity(Sprites.gate, 1160, 320, 40, 100, 64, 120, -10, 'gate_vis');
        addSolid(1160, 320, 40, 100, 'gate_col');
    }

    // Strict 3 NPCs as requested
    spawnEntity(Sprites.tent, 150, 150, 120, 60, 140, 100, -40, 'prop'); addSolid(150, 150, 120, 60, 'prop');
    spawnEntity(Sprites.table, 350, 200, 80, 30, 80, 50, -20, 'prop'); addSolid(350, 200, 80, 30, 'prop');
    
    spawnEntity(Sprites.worker, 370, 170, 24, 12, 32, 48, -36, 'npc', {name: 'Archaeologist', port: Portraits.worker, text: "Logs are updating.", state: 'working'});
    spawnEntity(Sprites.worker, 500, 500, 24, 12, 32, 48, -36, 'npc', {name: 'Cleaner', port: Portraits.worker, text: "Dust never sleeps.", state: 'working'});
    
    spawnEntity(Sprites.guard, 1100, 400, 24, 12, 32, 48, -36, 'npc', {
        name: 'Security', port: Portraits.guard, text: "Site is secure, Maya. I'll open the gate for you.",
        onTalk: () => {
            flags.gateOpen = true;
            solids = solids.filter(s => s.id !== 'gate_col');
            entities = entities.filter(e => e.type !== 'gate_vis');
        }
    });
}

function buildModernDig() {
    entities = []; solids = []; floors = [];
    player.sprite = Sprites.maya;
    player.x = 50; player.y = 400;

    for(let i=0; i<1200; i+=80) {
        spawnEntity(Sprites.dirtMound, i, 20, 80, 40, 80, 60, -20, 'prop'); addSolid(i, 0, 80, 60, 'mound');
        spawnEntity(Sprites.dirtMound, i, 740, 80, 40, 80, 60, -20, 'prop'); addSolid(i, 740, 80, 60, 'mound');
    }
    
    // TRENCH COLLISION (Gap left specifically for the bridge to enforce perfect AABB)
    let tx = 300, tw = 600;
    addSolid(tx, 150, tw, 200, 'trench'); 
    addSolid(tx, 430, tw, 220, 'trench');
    
    // Z-SORTING FIX: Plank bridge added to 'floors' array (drawn below entities)
    addFloor(Sprites.plankBridge, tx, 350, tw, 80);

    // WORKING EXCAVATORS (Stationed inside trench)
    const positions = [[350, 220], [800, 250], [450, 500], [700, 550]];
    positions.forEach(pos => {
        spawnEntity(Sprites.worker, pos[0], pos[1], 24, 12, 32, 48, -36, 'npc', { state: 'working' });
    });

    // Key NPC (Outside trench for easy access)
    spawnEntity(Sprites.worker, 250, 400, 24, 12, 32, 48, -36, 'npc', {
        name:'Worker', port:Portraits.worker, text:"Let me see. I'll take the brush.", bubble: true,
        onTalk: () => setTimeout(() => switchState('MINIGAME_BRUSH'), 1000)
    });
}

function buildAncientCity() {
    entities = []; solids = []; floors = [];
    player.sprite = Sprites.kavir;
    player.x = 100; player.y = 400;

    // DENSE MUD-BRICK ENVIRONMENT
    // Borders
    addSolid(0, 0, 1000, 60, 'wall'); addSolid(0, 740, 1000, 60, 'wall'); addSolid(0, 0, 40, 800, 'wall');
    
    // Houses
    const houses = [[60, 80], [200, 80], [400, 80], [600, 80], [60, 620], [250, 620], [450, 620]];
    houses.forEach(p => {
        spawnEntity(Sprites.house, p[0], p[1], 120, 80, 120, 100, -20, 'prop');
        addSolid(p[0], p[1], 120, 80, 'house');
    });

    // Central Well
    spawnEntity(Sprites.well, 350, 350, 80, 60, 80, 80, -20, 'prop'); addSolid(350, 350, 80, 60, 'well');

    // RIGHT-SIDE RIVER BARRIER & COLLISION (Gap left for bridge)
    let rx = 1000, rw = 200;
    addSolid(rx, 0, rw, 350, 'water');
    addSolid(rx, 450, rw, 350, 'water');
    
    // Z-SORTING FIX: Stone bridge added to 'floors'
    addFloor(Sprites.stoneBridge, rx, 350, rw, 100);

    // BUSTLING CROWDS & SHOPS
    spawnEntity(Sprites.stall1, 650, 250, 70, 30, 80, 60, -30, 'prop'); addSolid(650, 250, 70, 30, 'stall');
    spawnEntity(Sprites.stall2, 800, 350, 70, 30, 80, 60, -30, 'prop'); addSolid(800, 350, 70, 30, 'stall');
    spawnEntity(Sprites.stall3, 650, 450, 70, 30, 80, 60, -30, 'prop'); addSolid(650, 450, 70, 30, 'stall');

    // Static NPCs at stalls
    spawnEntity(Sprites.villager, 670, 290, 24, 12, 32, 48, -36, 'npc');
    spawnEntity(Sprites.villager, 670, 490, 24, 12, 32, 48, -36, 'npc');
    spawnEntity(Sprites.merchant, 830, 390, 24, 12, 32, 48, -36, 'npc', {
        name: 'Merchant', port: Portraits.merchant, text: "Match the weights accurately, traveler.",
        onTalk: () => { if(!flags.tradeComplete) initScaleMinigame(); }
    });

    // Wandering Villagers (Alleys)
    for(let i=0; i<5; i++) {
        spawnEntity(Sprites.villager, 150 + Math.random()*300, 200 + Math.random()*300, 24, 12, 32, 48, -36, 'ai_npc', {
            state: 'idle', timer: 1, tx: 0, ty: 0
        });
    }
}

// --- MINIGAMES ---
function initBrushMinigame() {
    dirtCanvas = document.createElement('canvas'); dirtCanvas.width = cw; dirtCanvas.height = ch;
    dirtCtx = dirtCanvas.getContext('2d');
    dirtCtx.fillStyle = '#4e342e'; dirtCtx.fillRect(0,0,cw,ch); 
    brushGrid.fill(false); flags.brushingComplete = false;
    document.getElementById('minigame-ui').classList.remove('hidden');
    document.getElementById('minigame-text').innerText = "Click & Drag to Brush Dirt";
}

let scaleWeights = [];
let draggedWeight = null;
function initScaleMinigame() {
    scaleMinigameActive = true;
    scaleWeights = [
        {val: 1, x: cw/2 - 100, y: ch/2 + 200, w: 40, h: 40, onPan: false},
        {val: 1, x: cw/2 - 40, y: ch/2 + 200, w: 40, h: 40, onPan: false},
        {val: 2, x: cw/2 + 20, y: ch/2 + 200, w: 60, h: 60, onPan: false},
        {val: 5, x: cw/2 + 100, y: ch/2 + 200, w: 80, h: 80, onPan: false}
    ];
}

// --- STATE MANAGER ---
function switchState(newState) {
    currentState = newState;
    activeDialogue = null; scaleMinigameActive = false;
    document.querySelectorAll('.panel:not(#hud-prompt):not(#journal-btn)').forEach(p => p.classList.add('hidden'));

    if (newState === 'MODERN_CAMP') { eraTheme = 'modern'; buildModernCamp(); }
    else if (newState === 'MODERN_DIG') { eraTheme = 'modern'; buildModernDig(); }
    else if (newState === 'MINIGAME_BRUSH') { eraTheme = 'modern'; initBrushMinigame(); }
    else if (newState === 'TRANSITION_WARP') {
        timeElapsed = 0; particles = [];
        for(let i=0; i<300; i++) particles.push({ angle: Math.random()*6.28, dist: Math.random()*50, speed: 50+Math.random()*200, col: ['#2ecc71', '#3498db', '#f1c40f'][Math.floor(Math.random()*3)] });
    }
    else if (newState === 'ANCIENT_CITY') { eraTheme = 'ancient'; buildAncientCity(); }
    
    document.getElementById('ui-layer').className = eraTheme === 'modern' ? 'theme-modern' : 'theme-ancient';
}

// --- UI / INPUTS ---
function toggleJournal() {
    document.getElementById('journal-panel').classList.toggle('hidden');
    let c = document.getElementById('journal-content');
    c.innerHTML = eraTheme === 'modern' 
        ? `<div class="journal-entry">- Objective: Report to Security.<br>- Proceed to Trench.</div>`
        : `<div class="journal-entry"><b>Barter Rates:</b><br><br>Trade Lapis Lazuli for 3 Spices.<br>Ratio: 3 Lapis = 2 Chert Weights</div>`;
}

window.addEventListener('keydown', e => { 
    if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; 
    if(e.key.toLowerCase() === 'j') toggleJournal();
});
window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; 
    if(scaleMinigameActive && draggedWeight) { draggedWeight.x = mouse.x - draggedWeight.w/2; draggedWeight.y = mouse.y - draggedWeight.h/2; }
});
window.addEventListener('mousedown', () => { mouse.isDown = true;
    if(scaleMinigameActive) draggedWeight = scaleWeights.slice().reverse().find(w => mouse.x > w.x && mouse.x < w.x+w.w && mouse.y > w.y && mouse.y < w.y+w.h) || null;
});
window.addEventListener('mouseup', () => { mouse.isDown = false;
    if(scaleMinigameActive && draggedWeight) {
        let panX = cw/2 + 100, panY = ch/2;
        if(Math.hypot((draggedWeight.x+draggedWeight.w/2)-panX, (draggedWeight.y+draggedWeight.h/2)-panY) < 120) {
            draggedWeight.onPan = true; draggedWeight.x = panX - draggedWeight.w/2 + (Math.random()*20-10); draggedWeight.y = panY - draggedWeight.h/2 + (Math.random()*20-10);
        } else { draggedWeight.onPan = false; }
        draggedWeight = null;
        if(scaleWeights.filter(w => w.onPan).reduce((s, w) => s + w.val, 0) === 2) { 
            flags.tradeComplete = true; scaleMinigameActive = false;
            triggerDialogue("Merchant", "Perfect balance. The spices are yours.", Portraits.merchant);
            inventory.ancient.push({id: 'spice', count: 3});
        }
    }
});

function triggerDialogue(speaker, text, portrait, cb) {
    activeDialogue = { cb };
    document.getElementById('dialog-box').classList.remove('hidden');
    document.getElementById('dialog-speaker').innerText = speaker;
    document.getElementById('dialog-text').innerText = text;
    const pCtx = document.getElementById('dialog-portrait').getContext('2d');
    pCtx.imageSmoothingEnabled = false; pCtx.clearRect(0,0,64,64); pCtx.drawImage(portrait, 0, 0);
}

function checkAABB(nx, ny, w, h) {
    if(nx < 0 || ny < 0 || nx + w > mapW || ny + h > mapH) return true; // Bounds
    for(let s of solids) {
        if(nx < s.x + s.w && nx + w > s.x && ny < s.y + s.h && ny + h > s.y) return true; 
    }
    return false;
}

// --- UPDATE LOOP ---
function update(dt) {
    timeElapsed += dt;

    if(keys.i && !prevKeys.i) {
        document.getElementById('inventory-panel').classList.toggle('hidden');
        let grid = document.getElementById('inv-grid'); grid.innerHTML = '';
        let inv = eraTheme === 'modern' ? inventory.modern : inventory.ancient;
        inv.forEach(item => {
            let div = document.createElement('div'); div.className = 'inv-slot';
            let c = document.createElement('canvas'); c.width=32; c.height=32; c.getContext('2d').drawImage(Icons[item.id],0,0);
            div.appendChild(c); div.innerHTML += `<span class="item-count">${item.count}</span>`; grid.appendChild(div);
        });
    }

    if(keys.e && !prevKeys.e && activeDialogue) {
        document.getElementById('dialog-box').classList.add('hidden');
        if(activeDialogue.cb) activeDialogue.cb(); activeDialogue = null;
        Object.assign(prevKeys, keys); return;
    }
    if(activeDialogue || scaleMinigameActive) { Object.assign(prevKeys, keys); return; }

    if (['MODERN_CAMP', 'MODERN_DIG', 'ANCIENT_CITY'].includes(currentState)) {
        let dx = 0, dy = 0;
        if(keys.w) dy -= 1; if(keys.s) dy += 1;
        if(keys.a) { dx -= 1; player.dir = -1; } if(keys.d) { dx += 1; player.dir = 1; }
        if(dx !== 0 && dy !== 0) { let len = Math.sqrt(dx*dx + dy*dy); dx/=len; dy/=len; }
        
        if(dx !== 0) {
            let nx = player.x + dx * player.speed * dt;
            if(!checkAABB(nx, player.y, player.w, player.h)) player.x = nx;
        }
        if(dy !== 0) {
            let ny = player.y + dy * player.speed * dt;
            if(!checkAABB(player.x, ny, player.w, player.h)) player.y = ny;
        }

        player.animTimer = (dx !== 0 || dy !== 0) ? player.animTimer + dt * 10 : 0;

        for(let e of entities) {
            if(e.type === 'ai_npc') {
                e.timer -= dt;
                if(e.timer <= 0) {
                    if(e.state === 'idle') {
                        e.state = 'walk'; e.tx = e.x + (Math.random()*150 - 75); e.ty = e.y + (Math.random()*150 - 75);
                        e.timer = 1 + Math.random()*2;
                    } else {
                        e.state = 'idle'; e.timer = 1 + Math.random()*2;
                    }
                }
                if(e.state === 'walk') {
                    let adx = (e.tx > e.x ? 1 : -1) * 40 * dt; let ady = (e.ty > e.y ? 1 : -1) * 40 * dt;
                    if(!checkAABB(e.x+adx, e.y+ady, e.w, e.h)) { e.x+=adx; e.y+=ady; } else { e.state='idle'; e.timer=1; }
                }
            }
        }

        interactTarget = null;
        let pCX = player.x + player.w/2, pCY = player.y + player.h/2;
        for(let e of entities) {
            if(e.text && Math.hypot(pCX - (e.x+e.w/2), pCY - (e.y+e.h/2)) < 60) { interactTarget = e; break; }
        }
        
        const prompt = document.getElementById('hud-prompt');
        if(interactTarget) { prompt.classList.remove('hidden'); if(keys.e && !prevKeys.e) triggerDialogue(interactTarget.name, interactTarget.text, interactTarget.port, interactTarget.onTalk); } 
        else { prompt.classList.add('hidden'); }

        if (currentState === 'MODERN_CAMP' && flags.gateOpen && player.x > 1150) switchState('MODERN_DIG');
    }
    else if (currentState === 'MINIGAME_BRUSH') {
        // BRUSH FIX: Strictly stop drawing when complete
        if(mouse.isDown && !flags.brushingComplete) {
            dirtCtx.globalCompositeOperation = 'destination-out';
            dirtCtx.beginPath(); dirtCtx.arc(mouse.x, mouse.y, 60, 0, 6.28); dirtCtx.fill();
            let col = Math.floor((mouse.x / cw) * 20), row = Math.floor((mouse.y / ch) * 20);
            if(col>=0 && col<20 && row>=0 && row<20) brushGrid[row*20+col] = true;
            
            if(brushGrid.filter(v=>v).length > 340) {
                flags.brushingComplete = true; 
                document.getElementById('minigame-text').innerText = "Artifact Found! Adding to Inventory...";
                setTimeout(() => switchState('TRANSITION_WARP'), 2000); // Wait exactly 2s
            }
        }
    }
    else if (currentState === 'TRANSITION_WARP') {
        for(let p of particles) { p.dist += p.speed * dt; p.speed += 800 * dt; }
        if(timeElapsed > 3) switchState('ANCIENT_CITY');
    }

    Object.assign(prevKeys, keys);
}

// --- RENDER LOOP ---
function draw(dt) {
    let camX = Math.max(0, Math.min(player.x + player.w/2 - cw/2, mapW - cw));
    let camY = Math.max(0, Math.min(player.y + player.h/2 - ch/2, mapH - ch));
    if(currentState === 'MINIGAME_BRUSH' || currentState === 'TRANSITION_WARP') { camX = 0; camY = 0; }

    ctx.fillStyle = eraTheme === 'modern' ? '#c2b280' : '#d2b48c'; 
    ctx.fillRect(0,0,cw,ch);
    ctx.save(); ctx.translate(-camX, -camY);

    if (currentState === 'MODERN_DIG') {
        ctx.fillStyle = ctx.createPattern(Sprites.trenchBg, 'repeat'); ctx.fillRect(300, 150, 600, 500);
    }
    if (currentState === 'ANCIENT_CITY') {
        ctx.fillStyle = ctx.createPattern(Sprites.waterAnim, 'repeat');
        ctx.save(); ctx.translate(0, -(timeElapsed*15)%128); ctx.fillRect(1000, -128, 200, mapH+256); ctx.restore();
    }

    if (['MODERN_CAMP', 'MODERN_DIG', 'ANCIENT_CITY'].includes(currentState)) {
        
        // Z-SORTING FIX: Draw specific floor objects (Bridges) below EVERYTHING
        for(let f of floors) ctx.drawImage(f.sprite, f.x, f.y);

        let renderList = [...entities, { ...player, type: 'player' }];
        renderList.sort((a, b) => (a.y + a.h) - (b.y + b.h));

        // Shadows
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        for(let e of renderList) {
            if(e.type !== 'prop') {
                ctx.beginPath(); ctx.ellipse(e.x+e.w/2, e.y+e.h, e.w*0.8, e.h*0.5, 0, 0, 6.28); ctx.fill();
            }
        }

        // Draw sorted sprites
        for(let e of renderList) {
            if (e.type === 'player') {
                let bob = Math.floor(player.animTimer) % 2 === 1 ? -2 : 0;
                ctx.save();
                if(player.dir === -1) { ctx.translate(e.x + e.w/2, e.y); ctx.scale(-1, 1); ctx.drawImage(player.sprite, -e.drawW/2, e.drawOffY + bob); }
                else { ctx.drawImage(player.sprite, e.x + e.w/2 - e.drawW/2, e.y + e.drawOffY + bob); }
                ctx.restore();
            } else {
                // Working NPCs Bob logic
                let bob = ((e.type === 'ai_npc' && e.state === 'walk') || (e.state === 'working')) && Math.floor(timeElapsed*6)%2===1 ? -2 : 0; 
                ctx.drawImage(e.sprite, e.x + e.w/2 - e.drawW/2, e.y + e.drawOffY + bob);
                if (e.bubble && !flags.brushingComplete) {
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(e.x+e.w/2, e.y-35, 12, 0, 6.28); ctx.fill();
                    ctx.fillStyle = '#000'; ctx.font="bold 16px sans-serif"; ctx.fillText("!", e.x+e.w/2-3, e.y-30);
                }
            }
        }

        if (currentState === 'MODERN_CAMP' && flags.gateOpen) {
            ctx.fillStyle = '#2ecc71'; let arrX = 1100 + Math.sin(timeElapsed*5)*10;
            ctx.beginPath(); ctx.moveTo(arrX, 400); ctx.lineTo(arrX+30, 415); ctx.lineTo(arrX, 430); ctx.fill();
        }
    }
    ctx.restore();

    if (currentState === 'MINIGAME_BRUSH') {
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(Icons.pot, cw/2 - 120, ch/2 - 120, 240, 240); // New Clay Pot
        ctx.drawImage(dirtCanvas, 0, 0); 
    }
    else if (currentState === 'TRANSITION_WARP') {
        ctx.fillStyle = `rgba(0,0,0, ${Math.max(0, 1 - (timeElapsed-2.8))})`; ctx.fillRect(0,0,cw,ch);
        ctx.save(); ctx.translate(cw/2, ch/2);
        for(let p of particles) { ctx.fillStyle = p.col; ctx.fillRect(Math.cos(p.angle)*p.dist, Math.sin(p.angle)*p.dist, 3, 15); }
        ctx.restore();
        if(timeElapsed > 2.8) { ctx.fillStyle = `rgba(255,255,255, ${(timeElapsed-2.8)*5})`; ctx.fillRect(0,0,cw,ch); }
    }
    else if (currentState === 'ANCIENT_CITY') {
        ctx.globalCompositeOperation = 'multiply';
        ctx.fillStyle = 'rgba(255, 160, 50, 0.4)'; ctx.fillRect(0, 0, cw, ch);
        ctx.globalCompositeOperation = 'source-over';

        if (scaleMinigameActive) {
            ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0,0,cw,ch);
            let cx = cw/2, cy = ch/2;
            ctx.fillStyle = '#b8860b'; ctx.fillRect(cx-15, cy-180, 30, 360); ctx.fillRect(cx-200, cy-150, 400, 15); 
            ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(cx-180, cy-135); ctx.lineTo(cx-130, cy+20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx+180, cy-135); ctx.lineTo(cx+130, cy+20); ctx.stroke();
            ctx.fillStyle = '#8b6508'; ctx.beginPath(); ctx.ellipse(cx-130, cy+20, 70, 25, 0, 0, 6.28); ctx.fill(); 
            ctx.beginPath(); ctx.ellipse(cx+130, cy+20, 70, 25, 0, 0, 6.28); ctx.fill(); 
            
            for(let i=0; i<3; i++) ctx.drawImage(Icons.lapis, cx-160 + i*25, cy-15, 32, 32);
            for(let w of scaleWeights) {
                ctx.drawImage(Icons.chert, w.x, w.y, w.w, w.h);
                if(w === draggedWeight) { ctx.strokeStyle = '#fff'; ctx.strokeRect(w.x-2, w.y-2, w.w+4, w.h+4); }
            }
            ctx.fillStyle = '#fff'; ctx.font = '28px Courier New'; ctx.textAlign = 'center';
            ctx.fillText("Match Requested Value", cx, cy - 220); ctx.textAlign = 'left';
        }
    }
}

// --- ENGINE LOOP ---
let lastTime = performance.now();
function loop(time) {
    let dt = (time - lastTime) / 1000; if (dt > 0.1) dt = 0.1; 
    lastTime = time; update(dt); draw(dt);
    requestAnimationFrame(loop);
}

// --- BOOT ---
initSprites();
switchState('MODERN_CAMP');
requestAnimationFrame(loop);

</script>
</body>
